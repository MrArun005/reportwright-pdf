name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'packages/std-fonts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Copy the library build and fonts into the site
        run: |
          mkdir -p site/lib site/fonts/std
          cp dist/index.js dist/fflate.js site/lib/
          cp public/fonts/Inter-Regular.ttf public/fonts/Inter-Bold.ttf public/fonts/NotoSansDevanagari-Regular.ttf site/fonts/
          cp packages/std-fonts/fonts/*.ttf site/fonts/std/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
