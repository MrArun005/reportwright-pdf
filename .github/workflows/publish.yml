# Publishes @reportwright/pdf to npm: on a GitHub Release (tag v*) or by hand (Actions > publish > Run workflow).
# Tests on Node 20 and 22, builds, then `npm publish --access public --tag <dist-tag>`. Needs the NPM_TOKEN secret
# (an npm automation token, see RELEASING.md). --provenance is added only while the repository is public.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (empty: "next" for a prerelease version like 1.0.0-beta.1, else "latest")'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  id-token: write # npm provenance (used only when the repository is public)
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: NPM_TOKEN is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::Add an npm automation token as the repository secret NPM_TOKEN (Settings > Secrets and variables > Actions). See RELEASING.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: The release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$v" ]; then echo "::error::The release tag $TAG is not v$v (package.json)"; exit 1; fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="$INPUT_TAG"
          case "$tag" in ''|next|latest) ;; *) echo "::error::tag is next, latest or empty"; exit 1 ;; esac
          if [ -z "$tag" ]; then case "$v" in *-*) tag=next ;; *) tag=latest ;; esac; fi
          args=(--access public --tag "$tag")
          if [ "$PRIVATE" = "false" ]; then args+=(--provenance); fi
          echo "Publishing @reportwright/pdf@$v with: ${args[*]}"
          npm publish "${args[@]}"
