name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run build
      - run: npx vitest run
      - name: Factur-X example passes the EN 16931 XSD
        if: matrix.node == 22
        run: |
          pip install -q factur-x
          node examples/invoice-facturx.mjs public/fonts/Inter-Regular.ttf "$RUNNER_TEMP/inv.pdf"
          python3 -c "
          import sys
          from facturx import get_xml_from_pdf, xml_check_xsd
          name, xml = get_xml_from_pdf(open(sys.argv[1], 'rb'), check_xsd=False)
          assert name == 'factur-x.xml', name
          assert xml_check_xsd(xml, flavor='factur-x', level='en16931')
          print('factur-x.xml passes the EN 16931 XSD')
          " "$RUNNER_TEMP/inv.pdf"
